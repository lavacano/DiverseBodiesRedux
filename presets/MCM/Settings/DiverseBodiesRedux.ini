[GENERAL]
; If the bAddChargenFlag option is enabled, pregenerated face parts will be ignored and heads will be created by the game at runtime. This will have a significant impact on performance. If the option is disabled, whenever a character has a pregenerated head it will not be possible to change any face or hair overlays. A game restart is required.
bAddChargenFlag=true
; Will reset the actor map on the next game load; always false unless set to true. After the reset this parameter will be automatically set to false.
bResetMapOnNextLoad=false

[PATH]
; You can specify multiple folders separated by commas, e.g., no spaces around commas. You may leave entries empty like sBodymorphsFolders=. If all parameters are empty, the mod will only operate as patches from the PATCH category.
; sBodymorphsFolders=Data/DiverseBodiesRedux/BodyPresets,C:/FalloutBodyPresets
sBodymorphsFolders=Data/DiverseBodiesRedux/BodymorphsFemale,Data/DiverseBodiesRedux/BodymorphsMale
sBodyhairsFolders=
sBodyTattoosFolders=Data/DiverseBodiesRedux/BodyTattoosFemale,Data/DiverseBodiesRedux/BodyTattoosFemaleStrip,Data/DiverseBodiesRedux/BodyTattoosRaiders
sNailsFolders=
sNPCPresetsFolders=Data/DiverseBodiesRedux/HeadsFemale,Data/DiverseBodiesRedux/HeadsMale,Data/DiverseBodiesRedux/HeadsFemaleRaiders,Data/DiverseBodiesRedux/HeadsFemaleSlaves
; Here you can specify folders with exclusions
sExclusions=Data/DiverseBodiesRedux/Exclusions

[PATCH]
; Some patches to prevent crashes which may be useful even without this mod.
bLooksMenuRemoveOverlayHook=true
bChangeHeadPart=true
bCBP2507=true
bHeadDataGuard=false
; Unequips and re-equips clothing on characters to restore cloth physics. A value <0 means DISABLED; other values indicate delay in seconds.
iReequipClothesWithExtraData=-1

[COLORS]
; Colors for components are specified as comma-separated hexadecimal RGBA values and override the colors of the selected theme; the high 16 bits represent transparency.
; Available themes: Glass,Neon,Vintage
; For components: Normal,Text,Hover,Selected
; For scrollPane: border,background
; [COLORS]
; sTheme=Glass                              		; Theme: Glass, Neon, Vintage
; sScrollPane=FF404040,FF101010                 	; Border, Background
; sLabel=,FFE0E0E0,FF606060,FF808080              	; Normal, Text, Hover, Selected
; sButton=FF4080A0,FFFFFFFF,FF6090C0,FF80A0D0       ; Normal, Text, Hover, Selected
; sCheckbox=FF3060A0,FFE0E0E0,FF4080B0,FF60A0E0     ; Normal, Text, Hover, Selected
; sSwitcher=FF507090,FFFFFFFF,FF6080B0,FF80A0D0     ; Normal, Text, Hover, Selected
sTheme=Neon
sScrollPane=
sLabel=
sButton=
sCheckbox=
sSwitcher=

[DEBUG]
; Examples
; sPrintAllPresets=AllPresets.txt ; will place AllPresets.txt in the Fallout 4 folder.
; sSerializationLog=Serialization.json ; will place Serialization.json in the Fallout 4 folder.
; bScaleformLog=true ; will place the AS3 log in My Documents/My Games/Fallout4/F4SE
sPrintAllPresets=
sSerializationLog=
bScaleformLog=false
; Logging level: messages below the specified level will not be shown.
; I recommend keeping it at no less than 5 unless you are debugging.
; 0 - trace
; 1 - debug
; 2 - info
; 3 - warn
; 4 - err
; 5 - critical
; 6 - off
iLogLevel=2
; The log keeps the output line in RAM until it receives a message of the specified level.
iLogFlush=2
